  EMSX: {name: EMSX, workflow: "Execução e roteamento de ordens"}
  FXGO: {name: FXGO, workflow: "Execução eletrônica de câmbio"}
  AIM: {name: AIM, workflow: "Gestão de ordens e compliance pré-trade (OMS)"}
  BVAL: {name: BVAL, workflow: "Precificação independente de ativos ilíquidos e crédito"}
  MARS: {name: MARS, workflow: "Risco de mercado, XVA e valuation de derivativos"}
