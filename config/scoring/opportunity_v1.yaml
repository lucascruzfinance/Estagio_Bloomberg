  COMPLIANCE: {name: Soluções de compliance, workflow: "Comunicação, vigilância e regulatório"}

# Regras de associação de produtos para gestoras (hipóteses de workflow).
product_rules:
  - when: {dominant_family: Multimercado}
    products: [TERMINAL, PORT, BQUANT, EMSX]
    rationale: Macro/multimercado opera juros, câmbio e derivativos com risco multiativo.
  - when: {dominant_family: Ações}
    products: [TERMINAL, BQL, PORT]
    rationale: Gestão de ações depende de dados de empresas, screening e atribuição.
  - when: {has_family: Crédito estruturado (FIDC)}
    products: [TERMINAL, BVAL, DATA_LICENSE]
    rationale: Crédito estruturado exige precificação independente e dados de referência.
  - when: {has_family: Private equity (FIP)}
    products: [TERMINAL, BQL]
    rationale: Private equity usa comparáveis, transações e dados de empresas.
  - when: {min_factor: {international: 0.6}}
    products: [TERMINAL, AIM]
    rationale: Alocação relevante no exterior aumenta necessidade de dados globais e controle de ordens.
  - when: {min_factor: {data_api_need: 0.6}}
    products: [DATA_LICENSE]
    rationale: Muitas classes com cota diária indicam demanda por dados em escala para backoffice e risco.
  - when: {institution_type: multi-family office}
    products: [PORT, TERMINAL]
    rationale: Family office consolida carteiras multiativos e reporta a famílias.

# Expectativas de domínio usadas para detectar rankings absurdos. São reportadas
# como pass/fail; uma falha é investigada, nunca corrigida ajustando pesos às cegas.
sanity_expectations:
  - higher: org-btg-pactual:asset-management
    lower: org-constellation
    output: fit
    rationale: Plataforma multiestratégia de grande porte vs boutique de ações de estratégia única.
  - higher: org-kinea
    lower: org-constellation
    output: fit
    rationale: Gestora multiproduto com alternativos vs boutique de ações.
  - higher: org-itau-bba:sales-trading-treasury
    lower: org-itau-bba:investment-banking-e-mercados
    output: fit
    rationale: Mesa de trading usa dados em tempo real e execução de forma mais intensa que banking.
  - higher: org-spx-capital
    lower: org-portofino
    output: fit
    rationale: Macro multiestratégia global vs multi-family office.
