# Modelo explicável de priorização comercial (Prompt 4).
#
# Não é probabilidade de compra nem relação causal. São três saídas separadas:
#   fit      — o workflow da unidade usa intensamente dados, ativos e ferramentas?
#   timing   — há sinais recentes de mudança que abrem uma conversa agora?
#   confiança — quanto da pontuação está apoiado em fonte verificável e recente?
# Pesos são premissas editáveis. Toda mudança exige novo `model_version`.
model_version: opportunity-v1.0.0
description: >-
  Priorização explicável para preparação de contas. Pesos definidos por julgamento
  especialista, sem variável-alvo histórica; calibrar quando houver resultados de
  oportunidades registrados (ver calibration.py).

fit:
  workflow_complexity:
    weight: 0.30
    label: Complexidade e intensidade de dados do workflow
    description: Intensidade média de dados das estratégias próprias (classes abertas, não-FIC), pela tabela family_data_intensity.
  asset_breadth:
    weight: 0.20
    label: Amplitude de ativos
    description: Número de famílias de estratégia distintas entre as estratégias próprias (abertas, não-FIC).
  international:
    weight: 0.15
    label: Atuação internacional
    description: Parcela das estratégias próprias que podem aplicar 100% no exterior ou são classificadas como exterior.
  data_api_need:
    weight: 0.15
    label: Necessidade de dados/API
    description: Classes/subclasses não-FIC com cota diária a precificar, controlar e reportar (proxy).
  user_potential:
    weight: 0.20
    label: Potencial de usuários
    description: Escala do PL não-FIC como proxy de equipe de gestão, risco e research (headcount não coletado).

timing:
  product_launches:
    weight: 0.25
    label: Lançamento de produtos
    description: Fundos abertos (não exclusivos) constituídos nos últimos 12 meses (data de constituição CVM); exclusivos são reportados à parte.
  net_flows:
    weight: 0.20
    label: Captação/resgates
    description: Captação líquida 12m sobre o PL das classes com série completa.
  expansion:
    weight: 0.15
    label: Expansão
    description: Novas entidades reguladas pela CVM no grupo nos últimos 24 meses.
  hiring:
    weight: 0.15
    label: Contratações
    description: Sinais curados de contratação com fonte (data/reference/commercial_signals.csv).
  m_and_a:
    weight: 0.10
    label: M&A
    description: Sinais curados de fusões, aquisições ou parcerias com fonte.
  operational_change:
    weight: 0.05
    label: Mudanças operacionais
    description: Sinais curados de troca de sistemas, administrador, custodiante ou regulação.
  performance:
    weight: 0.10
    label: Performance relativa
    description: Excesso de retorno 12m ponderado por PL contra a mediana da mesma classificação CVM.

limits:
  max_performance_weight: 0.10

scales:
  workflow_complexity: {kind: linear, low: 0.30, high: 1.0}
  asset_breadth: {kind: linear, low: 1, high: 8}
  international: {kind: linear, low: 0.0, high: 0.30}
  data_api_need: {kind: log, low: 10, high: 1500}
  user_potential: {kind: log, low: 2.0e8, high: 3.0e11}
  product_launches: {kind: log1p, low: 0, high: 30}
  net_flows: {kind: linear, low: -0.20, high: 0.20}
  expansion: {kind: linear, low: 0, high: 2}
  performance: {kind: linear, low: -0.10, high: 0.10}
  manual_signal: {kind: linear, low: 0, high: 2}

evidence_rules:
  min_net_flow_nav_coverage: 0.50
  min_performance_nav_coverage: 0.30
  launch_window_days: 365
  expansion_window_days: 730
  manual_signal_validity_days: 365

priority_index:
  fit: 0.60
  timing: 0.40

tiers:
  fit_high: 60
  timing_high: 50
  min_fit_coverage: 0.60
  min_timing_coverage: 0.40

confidence:
  evidence_coverage: 0.35
  identity: 0.20
  freshness: 0.15
  conflicts: 0.15
  comparability: 0.15
  pending_identity_factor: 0.60
  conflicts_for_zero: 5

reason_thresholds:
  positive: 0.65
  negative: 0.30

# Intensidade de dados por família de estratégia (premissa editável): quanto o
# workflow de gestão depende de preços, research, risco e execução multiativos.
family_data_intensity:
  Multimercado: 1.0
  Cambial: 1.0
  Ações: 0.8
  Crédito estruturado (FIDC): 0.8
  Renda fixa: 0.6
  Private equity (FIP): 0.6
  Previdência: 0.5
  Agro (FIAGRO): 0.5
  Imobiliário: 0.3
  Outros: 0.3

