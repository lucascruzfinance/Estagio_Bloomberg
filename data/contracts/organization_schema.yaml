    type: string
    nullable: false
    validation: ^org-[a-z0-9-]+$
    unit: not_applicable
    origin: source workbook or explicit normalization rule
    date_semantics: as_of_date records the evidence date; blank means unavailable
    confidence_semantics: row confidence never upgrades source-stated evidence to
      verified fact
